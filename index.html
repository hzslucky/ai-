<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 简历分析系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 简历分析系统</h1>
            <p class="subtitle">上传简历 PDF，智能提取关键信息并进行岗位匹配</p>
        </header>

        <main>
            <!-- Upload Section -->
            <section class="card upload-section">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <line x1="9" y1="15" x2="12" y2="12"/>
                            <line x1="15" y1="15" x2="12" y2="12"/>
                        </svg>
                    </div>
                    <p class="upload-text">拖拽 PDF 文件到此处，或点击上传</p>
                    <p class="upload-hint">仅支持 .pdf 格式，最大 10MB</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                </div>
                <div class="file-info" id="fileInfo" style="display:none">
                    <span class="file-name" id="fileName"></span>
                    <button class="btn-remove" id="btnRemove" title="移除">&times;</button>
                </div>
            </section>

            <!-- Job Description -->
            <section class="card job-section">
                <h2>岗位需求描述 <span class="badge">可选</span></h2>
                <textarea id="jobDescription" placeholder="请输入招聘岗位的需求描述，例如：&#10;需要一名有 3 年以上 Python 开发经验的后端工程师，熟悉 Django/FastAPI，有数据库设计和优化经验..."></textarea>
            </section>

            <!-- Actions -->
            <div class="actions">
                <button class="btn btn-primary" id="btnAnalyze" disabled>
                    <span class="btn-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                    </span>
                    开始分析
                </button>
                <button class="btn btn-secondary" id="btnReset">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                    </svg>
                    重置
                </button>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading" style="display:none">
                <div class="spinner"></div>
                <p>正在分析简历...</p>
            </div>

            <!-- Error -->
            <div class="alert alert-error" id="errorBox" style="display:none"></div>

            <!-- Results -->
            <div class="results" id="results" style="display:none">
                <!-- Basic Info -->
                <section class="card result-section">
                    <h2>基本信息</h2>
                    <div class="info-grid" id="basicInfo"></div>
                </section>

                <!-- Bonus Info -->
                <section class="card result-section" id="bonusSection" style="display:none">
                    <h2>求职与背景信息 <span class="badge badge-bonus">加分项</span></h2>
                    <div class="info-grid" id="bonusInfo"></div>
                </section>

                <!-- Projects -->
                <section class="card result-section" id="projectsSection" style="display:none">
                    <h2>项目经历</h2>
                    <div id="projectsList"></div>
                </section>

                <!-- Match Result -->
                <section class="card result-section" id="matchSection" style="display:none">
                    <h2>岗位匹配度分析</h2>
                    <div class="match-score-ring">
                        <div class="score-circle" id="scoreCircle">
                            <span class="score-value" id="scoreValue">0</span>
                            <span class="score-unit">%</span>
                        </div>
                    </div>
                    <div class="match-details" id="matchDetails"></div>
                    <div class="match-keywords" id="matchKeywords"></div>
                </section>

                <!-- Meta -->
                <div class="result-meta" id="resultMeta"></div>
            </div>
        </main>

        <footer>
            <p>AI 简历分析系统 &copy; 2026 | Powered by AI</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
